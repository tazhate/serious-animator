<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Beat 1: heading and the cache drawer -->
  <g data-beat="1" stroke="#222" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <text x="800" y="110" font-size="76" text-anchor="middle" fill="#222" stroke="none">КЭШ И TTL</text>
    <rect id="cache-box" x="190" y="340" width="260" height="200" rx="12" fill="#f4a261"/>
    <line x1="190" y1="440" x2="450" y2="440"/>
    <path d="M290 390 H350 M290 490 H350" fill="none" stroke-width="7"/>
    <rect x="240" y="300" width="120" height="70" rx="6" fill="#ffffff" stroke-width="4"/>
    <path d="M260 325 H340 M260 345 H320" fill="none" stroke-width="4"/>
    <text x="320" y="620" font-size="52" text-anchor="middle" fill="#222" stroke="none">КЭШ</text>
  </g>

  <!-- Beat 2: a clock for the record's time to live -->
  <g data-beat="2" stroke="#222" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <circle id="clock" cx="800" cy="440" r="110" fill="#ffffff"/>
    <path d="M800 345 V365 M895 440 H875 M800 535 V515 M705 440 H725" fill="none" stroke-width="5"/>
    <path id="hands" d="M800 440 V380 M800 440 L845 470" fill="none" stroke="#e63946" stroke-width="7"/>
    <text x="800" y="620" font-size="52" text-anchor="middle" fill="#222" stroke="none">TTL = 300 с</text>
  </g>

  <!-- Beat 3: the browser goes straight to the site -->
  <g data-beat="3" stroke="#222" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <rect id="site" x="1130" y="330" width="290" height="220" rx="14" fill="#ffffff"/>
    <path d="M1130 380 H1420" fill="none"/>
    <rect x="1160" y="405" width="110" height="110" rx="8" fill="#8ecae6" stroke-width="4"/>
    <path d="M1295 420 H1390 M1295 455 H1390 M1295 490 H1360" fill="none" stroke-width="5"/>
    <path id="go" d="M935 400 Q1030 350 1110 400" fill="none" stroke-width="5"/>
    <path d="M1084 386 L1112 401 L1082 413" fill="none" stroke-width="5"/>
    <text x="1275" y="630" font-size="52" text-anchor="middle" fill="#222" stroke="none">САЙТ</text>
  </g>

  <!-- Beat 4: the takeaway line at the bottom -->
  <g data-beat="4" stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <text x="300" y="790" font-size="60" fill="#e63946" stroke="none">ИТОГ:</text>
    <text x="490" y="790" font-size="60" fill="#222" stroke="none">example.com</text>
    <path d="M830 770 H960" fill="none"/>
    <path d="M935 750 L962 770 L935 790" fill="none"/>
    <text x="990" y="790" font-size="60" fill="#222" stroke="none">93.184.216.34</text>
  </g>
</svg>
